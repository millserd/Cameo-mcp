name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Compiles everything against the bundled Cameo API stubs and runs all unit tests; no Cameo needed.
      - run: bash devtools/compile-check.sh all --tests
