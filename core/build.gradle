// Pure-Java MCP protocol engine, JSON and the tool catalog. No Cameo dependencies.
plugins { id 'java-library' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

processResources {
    // The agent guide is served as an MCP resource; keep one source of truth in docs/.
    from(rootProject.file('docs/AGENT-GUIDE.md')) { into 'com/cameomcp' }
    inputs.property('version', project.version)
    filesMatching('com/cameomcp/version.properties') { expand(version: project.version) }
}

tasks.register('generateToolDocs', JavaExec) {
    group = 'documentation'
    description = 'Regenerates docs/TOOLS.md from the tool catalog.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cameomcp.catalog.CatalogDocs'
    args rootProject.file('docs/TOOLS.md').absolutePath
}
