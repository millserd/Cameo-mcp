// The Cameo plugin: hosts the MCP server inside Cameo, adds the MCP menu and status window.
//
// Compiles against a real Cameo install when -PcameoHome=<dir> (or CAMEO_HOME) is set,
// otherwise against the compile-only API stubs in :stubs.

def cameoHome = project.findProperty('cameoHome') ?: System.getenv('CAMEO_HOME')
def useRealCameo = cameoHome != null && file("${cameoHome}/lib").isDirectory()
if (cameoHome != null && !useRealCameo) {
    logger.warn("cameoHome '${cameoHome}' has no lib/ folder; compiling against stubs instead")
}

sourceSets {
    // Code that needs APIs from optional Cameo plugins (Dependency Matrix, Generic Table,
    // Relation Map). It ships as a separate jar loaded at runtime through a bridging class
    // loader, so the plugin still loads when those plugins are absent or versioned differently.
    optional {
        java { srcDirs = ['src/optional/java'] }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    optionalCompileOnly.extendsFrom compileOnly
}

dependencies {
    implementation project(':core')
    if (useRealCameo) {
        compileOnly fileTree(dir: "${cameoHome}/lib", include: ['**/*.jar'])
        optionalCompileOnly fileTree(dir: "${cameoHome}/plugins", include: ['**/*.jar'])
    } else {
        compileOnly project(':stubs')
    }
    testImplementation project(':core')
    testImplementation(useRealCameo ? fileTree(dir: "${cameoHome}/lib", include: ['**/*.jar']) : project(':stubs'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

def pluginId = 'com.cameomcp.plugin'

processResources {
    inputs.property('version', project.version)
}

jar {
    archiveFileName = 'cameo-mcp-plugin.jar'
    dependsOn ':core:jar'
    from { project(':core').sourceSets.main.output }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes('Implementation-Title': 'Cameo MCP', 'Implementation-Version': project.version) }
}

tasks.register('optionalJar', Jar) {
    archiveFileName = 'cameo-mcp-optional.jar'
    from sourceSets.optional.output
}

tasks.register('assemblePlugin', Copy) {
    group = 'distribution'
    description = 'Lays out the installable plugin folder under build/plugin-dist.'
    dependsOn jar, optionalJar, ':stdio:jar'
    def out = layout.buildDirectory.dir("plugin-dist/${pluginId}")
    into(out)
    from('plugin.xml') { expand(version: project.version) }
    from(jar)
    from(tasks.named('optionalJar'))
    // The stdio launcher ships inside the plugin folder so the status window can print its exact path.
    from(project(':stdio').tasks.named('jar'))
    // AGENTS.md is what agents opened in this folder read first; it points at the skill.
    from(rootProject.files('README.md', 'AGENTS.md'))
    into('skills') { from(rootProject.file('skills')) }
    // README.md shows this graphic via docs/how-it-works.svg.
    into('docs') { from(rootProject.file('docs/how-it-works.svg')) }
    doFirst { delete out }
}

tasks.register('deploy', Copy) {
    group = 'distribution'
    description = 'Copies the plugin into <cameoHome>/plugins. Restart Cameo afterwards.'
    dependsOn assemblePlugin
    doFirst {
        if (cameoHome == null) throw new GradleException('Pass -PcameoHome=<Cameo install dir> or set CAMEO_HOME')
        delete "${cameoHome}/plugins/${pluginId}"
    }
    from(layout.buildDirectory.dir("plugin-dist/${pluginId}"))
    into("${cameoHome ?: 'unset'}/plugins/${pluginId}")
}

tasks.register('rdzip', Zip) {
    group = 'distribution'
    description = 'Builds the Resource Manager bundle for Help > Resource/Plugin Manager > Import.'
    def rdId = '18740'
    def descriptorPath = "data/resourcemanager/MDR_Plugin_CameoMCP_${rdId}_descriptor.xml"
    // Resource Manager compares this integer to decide upgrades: 1.2.3 -> 10203.
    def (major, minor, patch) = project.version.toString().tokenize('.-').take(3)*.toInteger()
    archiveFileName = "cameo-mcp-${project.version}-rdzip.zip"
    destinationDirectory = rootProject.layout.buildDirectory.dir('dist')
    into("plugins/${pluginId}") { from(assemblePlugin) }
    from('resourcemanager-descriptor.xml') {
        rename { descriptorPath }
        expand(version: project.version, internal: major * 10000 + minor * 100 + patch, rdId: rdId,
               pluginId: pluginId, descriptorPath: descriptorPath, date: new Date().format('yyyy-MM-dd'))
        // List every file by name, as No Magic's own descriptors do. A "*.*" wildcard made Cameo
        // 2026x install the files one folder too deep (plugins/<id>/<id>/), so Cameo never saw plugin.xml.
        filter { line ->
            if (!line.contains('@PLUGIN_FILES@')) return line
            def root = tasks.named('assemblePlugin').get().destinationDir
            fileTree(root).files.collect { root.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort().collect {
                def path = "plugins/${pluginId}/${it}"
                "        <file from=\"${path}\" to=\"${path}\"/>"
            }.join('\n')
        }
    }
}
